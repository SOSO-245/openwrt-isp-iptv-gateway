services:
  iptv-discovery:
    build: .
    image: local/iptv-discovery:1.0
    container_name: iptv-discovery
    restart: unless-stopped
    environment:
      ROUTER_IP: ${ROUTER_IP:?Set the IPTV router LAN address}
      DOCKER_GATEWAY: ${DOCKER_GATEWAY:?Set the chosen container network gateway}
    ports:
      - "${NAS_IP:?Set the NAS LAN address}:18086:8080"
    volumes:
      - ./data:/data
      - ./api-token:/run/secrets/api-token:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpu_shares: 128
    mem_limit: 256m
    ulimits:
      nproc: 64
      nofile: 256
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2).read()"]
      interval: 60s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '2'
    networks: [discovery]
networks:
  discovery:
    ipam:
      config:
        - subnet: ${DISCOVERY_SUBNET:?Choose an unused private container subnet}
          gateway: ${DOCKER_GATEWAY:?Set the chosen container network gateway}
